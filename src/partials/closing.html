<section class="night" aria-labelledby="cta-title">
  <div class="lanes" aria-hidden="true"></div>
  <div class="wrap stand">
    <span class="posts" aria-hidden="true"></span>
    <div class="sign sign--night" data-shine data-light>
      <h2 id="cta-title">{{cta_title}}</h2>
      <p class="sign__line">{{cta_text}}</p>
      <a class="panel" href="/check-up/"><span>Get a free marketing <span class="nb">check-up</span></span>{{arrow}}</a>
      <span class="shine" aria-hidden="true"></span>
    </div>
    <div class="night__plates">
      <a class="plate plate--post" href="tel:+19704010185">Call (970) 401-0185</a>
      {{booking_post}}
    </div>
  </div>
</section>
